  <text x="180" y="193" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#818cf8" letter-spacing="1">SLS ЛАЗЕРНЕ СПІКАННЯ ПОЛІАМІДУ</text>
