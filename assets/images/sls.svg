    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgSls)" rx="10" stroke="#1e293b" stroke-width="1.5" />

  <rect x="55" y="75" width="250" height="90" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="4" />
  <rect x="60" y="80" width="240" height="80" fill="#0f172a" />
  <line x1="60" y1="95" x2="300" y2="95" stroke="#334155" stroke-width="1" stroke-dasharray="2,3" />
  <line x1="60" y1="110" x2="300" y2="110" stroke="#334155" stroke-width="1" stroke-dasharray="2,3" />
  <line x1="60" y1="125" x2="300" y2="125" stroke="#334155" stroke-width="1" stroke-dasharray="2,3" />

  <polygon points="120,130 170,105 240,105 190,130" fill="#6366f1" stroke="#818cf8" stroke-width="1" />
  <polygon points="120,130 120,150 190,150 190,130" fill="#4f46e5" stroke="#6366f1" stroke-width="1" />
  <polygon points="190,130 190,150 240,150 240,105" fill="#4338ca" stroke="#4f46e5" stroke-width="1" />

