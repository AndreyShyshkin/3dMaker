<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="cubeGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cubeGradLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cubeGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 8)" filter="url(#glow)">
    <polygon points="42,12 78,30 42,48 6,30" fill="url(#cubeGradTop)" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="6,30 42,48 42,84 6,66" fill="url(#cubeGradLeft)" stroke="#0284c7" stroke-width="1.5" />
    <polygon points="42,48 78,30 78,66 42,84" fill="url(#cubeGradRight)" stroke="#38bdf8" stroke-width="1.5" />

    <polygon points="38,2 46,2 44,8 40,8" fill="#f59e0b" stroke="#fbbf24" stroke-width="1" />
    <line x1="14" y1="52" x2="42" y2="66" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" />
    <line x1="42" y1="66" x2="70" y2="52" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <text x="106" y="58" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    3d<tspan fill="#38bdf8">Maker</tspan>
  </text>
  <text x="108" y="80" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2.5">
    СЕРВІС 3D-ДРУКУ ТА ВИРОБНИЦТВА
  </text>
</svg>
